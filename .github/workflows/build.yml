name: build-polaris-kernel

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libssl-dev bc \
            python3 python3-pip cpio gzip xz-utils git wget curl

      - name: Download AOSP arm64 GCC 4.9 toolchain
        run: |
          mkdir -p ~/toolchain
          cd ~/toolchain
          wget -q --no-check-certificate \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android10-release.tar.gz" \
            -O gcc49.tar.gz
          mkdir -p gcc49
          tar -xzf gcc49.tar.gz -C gcc49
          ls gcc49/bin | head

      - name: Clone official Xiaomi polaris kernel source (dipper-q-oss)
        run: |
          cd ~
          git clone --depth 1 -b dipper-q-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel

      - name: Restore techpack/audio sources (stripped from official tree)
        run: |
          # 官方 dipper-q-oss 树把 sdm845 音频驱动源码剥离了 (techpack 只剩 stub),
          # 导致 vendor 闭源音频模块 (snd-soc-sdm845/wsa881x/wcd-spi) 加载时
          # Unknown symbol (swr_*/wcd_spi_*). 从完整 CAF 树 (LawRun) 移植回来。
          cd ~
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/negrroo/LawRun_xiaomi_sdm845_CAF.git lawrun-audio
          cd lawrun-audio
          git sparse-checkout set techpack/audio
          cp -r techpack/audio ~/kernel/techpack/audio
          # 完整编译 asoc/ dsp/ ipc/ soc/ 四个子目录:
          #   soc/: swr_*/wcd_spi_* (soundwire/regmap-swr/swr-wcd-ctrl/wcd-spi-ac)
          #   dsp/: q6afe 等 afe_* 符号 (SND_SOC_MSM_QDSP6V2_INTF)
          #   ipc/: apr 通道 (MSM_QDSP6_APRV2_GLINK)
          #   asoc/: msm-pcm platform driver + apr_elliptic + elliptic (SND_SOC_QDSP6V2)
          #         —— q6afe 与 elliptic 是闭环依赖, 必须一起编。
          # machine driver/codec (SND_SOC_MACHINE_SDM845/WCD934X) 不启用, 留给 vendor 闭源 .ko。
          cd ~/kernel/techpack/audio
          grep -n "obj-y" Makefile
          # 官方树也删了 techpack/Kconfig 及 arch/arm64/Kconfig 的 source 引用
          printf 'source techpack/audio/Kconfig\n' > ~/kernel/techpack/Kconfig
          cd ~/kernel
          # 官方树 drivers/base/regmap/Makefile 残留了 regmap-swr.o 引用,
          # 但源码已被剥离 (现已在 techpack/audio/soc/), 删掉残留避免 No rule 错误。
          sed -i '/CONFIG_REGMAP_SWR) += regmap-swr.o/d' drivers/base/regmap/Makefile
          python3 - <<'PY'
          p = 'arch/arm64/Kconfig'
          s = open(p).read()
          old = 'source "lib/Kconfig"\n\nconfig HWCONF_MANAGER'
          new = 'source "lib/Kconfig"\n\nsource "techpack/Kconfig"\n\nconfig HWCONF_MANAGER'
          assert old in s, "anchor not found"
          open(p, 'w').write(s.replace(old, new))
          PY
          grep -n "techpack/Kconfig" arch/arm64/Kconfig

      - name: Patch apr.c for ADSP-up fallback populate
        run: |
          cd ~/kernel
          # vendor 音频模块加载成功却 refcount=0 / 声卡不注册:
          # apr 只在收到 ADSP-up(PDR) 事件后才 of_platform_populate() 建子设备,
          # 事件链失效则 sound-tavil 等设备永不出现, vendor machine driver 无设备可绑。
          # v3: 改为轮询 apr_get_q6_state() —— ADSP 固件一被 adsp-loader 装载
          # (q6_state != DOWN) 就立刻 populate, 彻底绕开 PDR/SSR 事件链。
          python3 "$GITHUB_WORKSPACE/patches/patch_apr.py" techpack/audio/ipc/apr.c
          echo "--- 补丁结果 ---"
          grep -n "apr_fallback_populate\|Q6 is Up\|populating child devices" techpack/audio/ipc/apr.c

      - name: Apply gcc10+ -fcommon fix for dtc
        run: |
          cd ~/kernel
          sed -i 's|HOSTCFLAGS_DTC := -I$(src) -I$(src)/libfdt|HOSTCFLAGS_DTC := -I$(src) -I$(src)/libfdt -fcommon|' scripts/dtc/Makefile
          grep -n "HOSTCFLAGS_DTC :=" scripts/dtc/Makefile

      - name: Fix gcc-wrapper.py for Python 3
        run: |
          cd ~/kernel
          # gcc-wrapper.py 是高通 CAF 的 Python2 包装器, 小米官方编译不需要它。
          # 直接让 CC 指向真实 gcc, 绕开 wrapper, 避免 Python2 语法 + bytes/str 问题。
          sed -i 's|^CC\s*=.*gcc-wrapper.py.*$|CC = $(REAL_CC)|' Makefile
          grep -n "^CC" Makefile | head

      - name: Pin vermagic to stock g10af704
        run: |
          cd ~/kernel
          # setlocalversion 直接输出固定值, 彻底避开 git dirty 检测和 + 号,
          # 让 vendor 闭源模块 (wlan.ko 等) 通过 vermagic 校验。
          printf '#!/bin/sh\necho -perf-g10af704\n' > scripts/setlocalversion
          chmod +x scripts/setlocalversion
          cat scripts/setlocalversion

      - name: MODVERSIONS - 满足 VINTF, 同时容忍 vendor 模块 CRC 不一致
        run: |
          cd ~/kernel
          # 【为什么必须开着】框架兼容性矩阵 (VINTF) 强制要求内核 CONFIG_MODVERSIONS=y。
          #   缺它 -> VintfObject.verifyWithoutAvb() 返回 INCOMPATIBLE(1)
          #        -> Build.isBuildConsistent() = false
          #        -> ActivityManagerService 弹窗:
          #           "Android 系统 / 您的设备内部出现了问题。请联系您的设备制造商了解详情。"
          #   真实设备日志: E/Build(1884): Vendor interface is incompatible, error=1
          #   实测设备 /system/etc/vintf/compatibility_matrix.*.xml 要求 261 项内核项,
          #   我们唯一与原厂不同的就是这一项 (已用解出的原厂 stock.config 逐项核对)。
          # 【为什么以前要关】vendor 闭源模块 (qca_cld3_wlan.ko 等) 按原厂内核编译,
          #   自带原厂 CRC; 我们多了 docker 等配置 -> 符号 CRC 必然不同 ->
          #   check_version() 返回 0 -> 模块加载报 Exec format error (WiFi 曾因此挂掉)。
          # 【两全方案】保留 MODVERSIONS=y (满足 VINTF), 只把 CRC 不一致从
          #   "拒绝加载" 降级为 "警告后继续加载" —— 仅改 bad_version 的返回值。
          # vermagic 里保持 "modversions " 字样 (MODVERSIONS=y 时本就会出现)。
          grep -n "MODULE_VERMAGIC_MODVERSIONS" include/linux/vermagic.h
          sed -i 's|#define MODULE_VERMAGIC_MODVERSIONS ""|#define MODULE_VERMAGIC_MODVERSIONS "modversions "|' \
            include/linux/vermagic.h
          python3 - <<'PYEOF'
          import sys
          p = "kernel/module.c"
          s = open(p).read()
          i = s.find("bad_version:")
          if i < 0:
              print("bad_version: 未找到"); sys.exit(1)
          j = s.find("return 0;", i)
          if j < 0:
              print("bad_version 后的 return 0; 未找到"); sys.exit(1)
          s = s[:j] + "return 1;  /* relaxed: allow vendor modules with stock CRCs */" + s[j + len("return 0;"):]
          open(p, "w").write(s)
          print("module.c: CRC 不一致已放宽 (offset %d)" % j)
          PYEOF
          echo "--- 补丁结果 ---"
          grep -n -A6 "^bad_version:" kernel/module.c

      - name: Build kernel
        run: |
          cd ~/kernel
          export PATH=~/toolchain/gcc49/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export ARCH=arm64
          make O=out polaris_user_defconfig
          ./scripts/config --file out/.config -d LOCALVERSION_AUTO
          ./scripts/config --file out/.config --set-str LOCALVERSION ""
          # MODVERSIONS 必须 =y (VINTF 框架兼容性矩阵强制要求, 缺它开机弹
          # "您的设备内部出现了问题")。vendor 模块的 CRC 容忍由上面 module.c 补丁解决。
          ./scripts/config --file out/.config -e MODVERSIONS
          # 补齐 docker 需要的命名空间/cgroup/网络/存储内核项
          ./scripts/config --file out/.config -e USER_NS
          ./scripts/config --file out/.config -e PID_NS
          ./scripts/config --file out/.config -e UTS_NS
          ./scripts/config --file out/.config -e IPC_NS
          ./scripts/config --file out/.config -e VETH
          ./scripts/config --file out/.config -e CGROUP_DEVICE
          ./scripts/config --file out/.config -e CGROUP_PIDS
          ./scripts/config --file out/.config -e CGROUP_PERF
          ./scripts/config --file out/.config -e BLK_CGROUP
          ./scripts/config --file out/.config -e NETFILTER_XT_MATCH_ADDRTYPE
          ./scripts/config --file out/.config -e MACVLAN
          ./scripts/config --file out/.config -e IPVLAN
          ./scripts/config --file out/.config -e BINFMT_MISC
          ./scripts/config --file out/.config -e CHECKPOINT_RESTORE
          # devtmpfs: 容器 App 的"硬件访问模式"要求内核注册 devtmpfs 文件系统。
          # 小米原厂内核也是关的 (Android 习惯用 tmpfs + ueventd 管 /dev),
          # 所以原厂内核跑这个 App 同样会报 devtmpfs ✗。
          # MOUNT 必须保持 =n: 内核就不会自动挂载, Android 的 /dev 管理方式完全不变,
          # 只是把 devtmpfs 注册进来供 App 自己挂载。
          ./scripts/config --file out/.config -e DEVTMPFS
          ./scripts/config --file out/.config -d DEVTMPFS_MOUNT
          # --- 以下项会改变 struct net_device / struct net 的字段布局 ---
          # vendor 的闭源 wlan.ko 按原厂布局编译, 布局不一致会导致
          # regulatory 数据错乱 (no reg rules) 并在加载后自行关闭。
          # 这些项 docker 单机运行并不需要, 必须保持与原厂一致 (=n)。
          ./scripts/config --file out/.config -d NET_L3_MASTER_DEV
          ./scripts/config --file out/.config -d CGROUP_NET_PRIO
          ./scripts/config --file out/.config -d CGROUP_NET_CLASSID
          ./scripts/config --file out/.config -d IP_VS
          ./scripts/config --file out/.config -d NETFILTER_XT_MATCH_IPVS
          # LXC 额外需要的内核项
          ./scripts/config --file out/.config -e POSIX_MQUEUE
          ./scripts/config --file out/.config -e SECCOMP
          ./scripts/config --file out/.config -e SECCOMP_FILTER
          ./scripts/config --file out/.config -e DEVPTS_MULTIPLE_INSTANCES
          ./scripts/config --file out/.config -e CGROUP_CPUACCT
          ./scripts/config --file out/.config -e CGROUP_SCHED
          ./scripts/config --file out/.config -e IP_NF_TARGET_MASQUERADE
          ./scripts/config --file out/.config -e NETFILTER_XT_MATCH_MULTIPORT
          ./scripts/config --file out/.config -e NETFILTER_XT_MATCH_COMMENT
          # 音频: vendor 闭源音频模块需要内核导出 swr_*/wcd_spi_*/afe_* 符号
          # (原厂内核 built-in 了 SoundWire + wcd codec 核心 + q6afe, 官方树被剥离)
          ./scripts/config --file out/.config -e SOUNDWIRE
          ./scripts/config --file out/.config -e REGMAP_SWR
          ./scripts/config --file out/.config -e WCD_SPI_AC
          # SOUNDWIRE_WCD_CTRL 是 vendor swr_wcd_ctrl.ko 的开源对应物, 必须 =n,
          # 否则 vendor 模块加载报 "duplicate symbol swrm_wcd_notify" 导致声卡注册失败。
          ./scripts/config --file out/.config -d SOUNDWIRE_WCD_CTRL
          # TAS2559: MIX 2S(polaris) 的 machine driver (techpack/audio/asoc/sdm845.c)
          # 在 get_hw_version_platform()==HARDWARE_PLATFORM_POLARIS 时会无条件加入
          # "tas2559 ASI1" 这条 DAI link (msm_quat_mi2s_tas2559_dai_links, 无 #ifdef 保护)。
          # 原厂内核把该 codec built-in (原厂 Image 里有 snd_soc_tas2559 /
          # techpack/audio/asoc/codecs/tas2559/tas2559-core.c 等字符串), 而官方
          # dipper-q-oss 树把源码剥离了 -> DAI 未注册 -> snd_soc_register_card 直接失败
          # -> /dev/snd 只剩 timer -> 无声, 且视频因缺音频时钟被拖成加速播放。
          # 真实日志证据:
          #   sdm845-asoc-snd ...:sound-tavil: ASoC: CODEC DAI tas2559 ASI1 not registered
          ./scripts/config --file out/.config -e SND_SOC_TAS2559
          ./scripts/config --file out/.config -e SND_SOC_MSM_QDSP6V2_INTF
          ./scripts/config --file out/.config -e MSM_QDSP6_APRV2_GLINK
          ./scripts/config --file out/.config -e SND_SOC_QDSP6V2
          # platform driver / dsp 核心 (原厂 built-in, vendor machine/codec .ko 依赖)
          ./scripts/config --file out/.config -e SND_HWDEP_ROUTING
          ./scripts/config --file out/.config -e MSM_QDSP6_NOTIFIER
          ./scripts/config --file out/.config -e MSM_QDSP6_PDR
          ./scripts/config --file out/.config -e MSM_QDSP6_SSR
          ./scripts/config --file out/.config -e MSM_ADSP_LOADER
          ./scripts/config --file out/.config -e MSM_AVTIMER
          ./scripts/config --file out/.config -e SND_SOC_MSM_HOSTLESS_PCM
          ./scripts/config --file out/.config -e SND_SOC_MSM_STUB
          ./scripts/config --file out/.config -e SND_SOC_MSM_HDMI_CODEC_RX
          ./scripts/config --file out/.config -e QTI_PP
          ./scripts/config --file out/.config -e MSM_QDSP6V2_CODECS
          make O=out olddefconfig
          make O=out -j$(nproc) Image.gz-dtb

      - name: Collect artifacts
        run: |
          mkdir -p ~/artifacts
          cp ~/kernel/out/arch/arm64/boot/Image.gz-dtb ~/artifacts/
          cp ~/kernel/out/arch/arm64/boot/Image.gz ~/artifacts/ 2>/dev/null || true
          cp ~/kernel/out/.config ~/artifacts/polaris_user.config 2>/dev/null || true
          ls -la ~/artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: polaris-kernel-Image-gz-dtb
          path: ~/artifacts/*
          retention-days: 30
